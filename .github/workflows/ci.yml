name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Black (formatting)
        run: black --check crucible/ tests/

      - name: Ruff (linting)
        run: ruff check crucible/ tests/

      - name: Mypy (type checking)
        run: |
          mypy crucible/ tests/ > mypy_output.txt 2>&1 || (cat mypy_output.txt && exit 1)

      - name: Upload Mypy Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-log-${{ matrix.python-version }}
          path: mypy_output.txt

      - name: Commit and push debug logs to branch
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b ci-debug-lint-${{ matrix.python-version }}
          git add mypy_output.txt || true
          git commit -m "chore: debug lint logs for ${{ matrix.python-version }}" || true
          git push origin HEAD --force

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=crucible --cov-report=xml > pytest_output.txt 2>&1 || (cat pytest_output.txt && exit 2)

      - name: Upload Pytest Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest_output.txt

      - name: Commit and push debug logs to branch
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b ci-debug-test-${{ matrix.os }}-${{ matrix.python-version }}
          git add pytest_output.txt || true
          git commit -m "chore: debug test logs for ${{ matrix.os }} ${{ matrix.python-version }}" || true
          git push origin HEAD --force

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
