name: 'Crucible Security Scan'
description: 'Autonomous security testing for AI agents and LLM applications.'
author: 'Crucible Security'
inputs:
  target-url:
    description: 'The endpoint URL of the AI agent to scan.'
    required: true
  severity-threshold:
    description: 'Severity level to fail the build (critical, high, medium, low).'
    default: 'high'
  modules:
    description: 'Comma-separated list of security modules to run.'
    default: ''
  api-key:
    description: 'Optional API key for the target agent.'
    required: false
  llm-provider-key:
    description: 'API key for the LLM provider used for research/reporting (e.g. GEMINI_API_KEY).'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Crucible
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install crucible-security

    - name: Run Crucible Scan
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.llm-provider-key }}
      run: |
        MODULE_FLAG=""
        if [ -n "${{ inputs.modules }}" ]; then
          MODULE_FLAG="--module ${{ inputs.modules }}"
        fi
        
        HEADER_FLAG=""
        if [ -n "${{ inputs.api-key }}" ]; then
          HEADER_FLAG="-H 'Authorization: Bearer ${{ inputs.api-key }}'"
        fi

        crucible scan --target ${{ inputs.target-url }} \
          --fail-on ${{ inputs.severity-threshold }} \
          $MODULE_FLAG \
          $HEADER_FLAG \
          --format table
