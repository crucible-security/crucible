[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crucible-security"
version = "0.18.0"
description = "pytest for AI agents -- test, score, and harden AI agents before production"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Crucible Contributors"},
]
keywords = [
    "ai",
    "agents",
    "security",
    "testing",
    "llm",
    "owasp",
    "red-team",
    "langchain",
    "crewai",
    "prompt-injection",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "anyio>=4.0.0",
    "jmespath>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "black>=24.0,<25",
    "ruff>=0.4,<1",
    "respx>=0.21,<1",
    "cryptography>=42.0.0",
]

[project.scripts]
crucible = "crucible.cli:app"

[project.urls]
Homepage = "https://github.com/crucible-security/crucible"
Documentation = "https://crucible-security.github.io/crucible"
Repository = "https://github.com/crucible-security/crucible"
Issues = "https://github.com/crucible-security/crucible/issues"
Changelog = "https://github.com/crucible-security/crucible/blob/main/CHANGELOG.md"

# ── Tool Configuration ──────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.hatch.build.targets.sdist]
include = [
    "/crucible",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line length handled by black
    "RUF001",  # intentional Unicode in bypass-test prompts
    "B008",    # common Typer default= pattern
    "RUF012",  # mutable class vars in Pydantic models
    "SIM110",  # comprehension style — readability preference
    "B904",    # raise in except — typer.Exit(code=1) is not exception chaining
    "N802",    # uppercase in test function names (grade letter in name e.g. grade_A)
    "SIM102",  # nested-if readability preference in hot-path simulation loops
    "SIM103",  # return negated condition — readability preference
    "E741",    # ambiguous var `l` in variance formula (math convention)
    "RUF002",  # en-dash in docstrings — intentional for readability
    "TC001",   # application import into TYPE_CHECKING — runtime use in targets package
    "TC003",   # stdlib import into TYPE_CHECKING — runtime use (HTTPServer ClassVar)
    "TC005",   # empty TYPE_CHECKING block — kept for clarity in some modules
    "BLE001",  # blind exception in network polling loops (TargetRunner._wait_for_ready)
]

[tool.ruff.lint.isort]
known-first-party = ["crucible"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
disable_error_code = ["unused-ignore"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring network",
    "linux_only: marks tests requiring Linux kernel with eBPF/BCC support",
]

[tool.coverage.run]
source = ["crucible"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 68
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]

[[tool.mypy.overrides]]
module = [
    "libcst.*",
    "github.*",
    "google.*",
    "google.generativeai.*",
    "fastapi.*",
    "fastapi",
    "uvicorn",
    "jmespath",
    "yaml",
    "bcc",
    "bcc.*",
]
ignore_missing_imports = true

# patcher.py uses google-generativeai attributes that are not explicitly exported
# by the stubs, so type: ignore[attr-defined] is needed locally. But in CI
# (where google-generativeai is not installed) those same ignores become "unused"
# because ignore_missing_imports already silences the whole module. We disable
# warn_unused_ignores for this one file to make both environments happy.
[[tool.mypy.overrides]]
module = "crucible.core.patcher"
warn_unused_ignores = false

# api.py uses FastAPI's @app.get() / @app.post() decorators which are untyped
# at the stub level. In strict mode mypy emits [misc] for every decorated route.
# This override silences that unfixable decorator issue for this one file only.
[[tool.mypy.overrides]]
module = "crucible.core.api"
disable_error_code = ["misc", "untyped-decorator"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["abstract", "arg-type", "misc", "assignment", "type-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = "crucible.trace.policy"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "crucible.modules.security"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "crucible.ebpf.controller"
# Linux-only optional module with conditional BCC imports — suppress cross-platform type issues
disable_error_code = ["name-defined", "misc", "unused-ignore", "assignment"]
